  cloud_functions: ^5.1.0
  firebase_storage: ^12.0.2
  firebase_app_check: ^0.3.1+2
  provider: ^6.0.5
  flutter_riverpod: ^2.5.1
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  qr_flutter: ^4.1.0
  pdf: ^3.11.0
